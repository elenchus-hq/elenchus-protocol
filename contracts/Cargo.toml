[workspace]
resolver = "2"
members = [
  "common",
  "claim-registry",
  "inquiry-escrow",
  "staking",
  "reputation",
  "cross-exam",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/elenchus-hq/elenchus-protocol"

[workspace.dependencies]
# Verify the current release with `stellar contract init` before first build.
soroban-sdk = "29"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
